[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmecorp-data-pipeline"
version = "1.0.0"
description = "AcmeCorp Data Pipeline — Python modernization of legacy Bash ETL system"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "requests>=2.28",
    "boto3>=1.26",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
