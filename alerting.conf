# Alerting Configuration
# Managed by: SRE team
# Contact: devops@acmecorp.com

# Severity levels: CRITICAL, WARNING, INFO
# Routes: slack, email, pagerduty

[thresholds]
disk_usage_warning=80
disk_usage_critical=95
job_runtime_warning_minutes=60
job_runtime_critical_minutes=120
error_rate_warning_pct=5
error_rate_critical_pct=15
row_count_deviation_pct=20

[slack]
enabled=true
channel=#data-pipeline-alerts
webhook=https://hooks.slack.com/services/T0123/B4567/xYzAbCdEfGhIjKlMnOpQrSt
mention_on_critical=@here

[email]
enabled=true
smtp_host=smtp.acmecorp.internal
smtp_port=587
from=pipeline-alerts@acmecorp.com
to=data-ops@acmecorp.com
cc=data-eng-leads@acmecorp.com

[pagerduty]
enabled=true
integration_key=pd-integration-key-abc123
severity_map_critical=critical
severity_map_warning=warning
